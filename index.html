<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovolve - 커플을 위한 AI 관계 코칭</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.8; color: #333; background: linear-gradient(135deg, #fdf2f4 0%, #fff 100%); min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 60px 20px; text-align: center; }
    .logo { font-size: 64px; margin-bottom: 20px; }
    h1 { color: #DA7F8F; font-size: 32px; margin-bottom: 12px; }
    .tagline { font-size: 18px; color: #666; margin-bottom: 40px; }
    .features { text-align: left; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(218, 127, 143, 0.1); margin-bottom: 40px; }
    .features h2 { font-size: 18px; color: #DA7F8F; margin-bottom: 16px; }
    .features ul { list-style: none; }
    .features li { padding: 8px 0; padding-left: 28px; position: relative; color: #444; }
    .features li::before { content: "♥"; position: absolute; left: 0; color: #DA7F8F; }
    .links { margin-top: 32px; }
    .links a { color: #DA7F8F; text-decoration: none; margin: 0 12px; font-size: 14px; }
    .links a:hover { text-decoration: underline; }
    .badge { display: inline-block; margin-top: 40px; }
    .badge img { height: 50px; }
    .contact { margin-top: 40px; font-size: 14px; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">💕</div>
    <h1>Lovolve</h1>
    <p class="tagline">커플을 위한 AI 관계 코칭 앱</p>

    <div class="features">
      <h2>주요 기능</h2>
      <ul>
        <li>프라이빗 메신저 - 둘만의 안전한 대화 공간</li>
        <li>AI 케어 모드 - 감정적인 순간에 도움을 드려요</li>
        <li>러브 에피소드 - 대화가 아름다운 이야기가 돼요</li>
        <li>기념일 관리 - 소중한 날을 함께 기억해요</li>
      </ul>
    </div>

    <div class="links">
      <a href="privacy.html">개인정보처리방침</a>
      <a href="terms.html">이용약관</a>
    </div>

    <div class="badge">
      <a href="https://apps.apple.com/app/lovolve">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
      </a>
    </div>

    <p class="contact">문의: support@lovolve.app</p>
  </div>
</body>
</html>
